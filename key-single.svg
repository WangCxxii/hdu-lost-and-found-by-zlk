<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="单把钥匙插画">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="95%">
      <stop offset="0" stop-color="#fffbf2"/>
      <stop offset="1" stop-color="#ffeccd"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#e4e9ef"/>
      <stop offset=".65" stop-color="#aeb8c5"/>
      <stop offset="1" stop-color="#7f8b9a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d18a"/>
      <stop offset="1" stop-color="#b8862f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#8a5b1a" flood-opacity=".22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#b97a22" opacity=".09"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#dots)"/>
  <circle cx="316" cy="86" r="54" fill="#ffffff" opacity=".55"/>
  <ellipse cx="200" cy="330" rx="120" ry="18" fill="#8a5b1a" opacity=".14" filter="url(#soft)"/>
  <g filter="url(#shadow)" transform="rotate(-24 200 200)">
    <circle cx="166" cy="120" r="42" fill="none" stroke="url(#silver)" stroke-width="14"/>
    <circle cx="166" cy="120" r="42" fill="none" stroke="#ffffff" stroke-width="2" opacity=".5"/>
    <path d="M166 162v150" stroke="url(#silver)" stroke-width="16" stroke-linecap="round"/>
    <path d="M174 232h40v20h-30v22h30v20h-40" fill="none" stroke="url(#silver)" stroke-width="14" stroke-linejoin="round"/>
    <path d="M174 270h20" stroke="#ffffff" stroke-width="3" opacity=".5"/>
    <circle cx="166" cy="112" r="8" fill="#ffffff" opacity=".55"/>
    <g transform="translate(128 70) rotate(-12)">
      <circle cx="40" cy="0" r="9" fill="none" stroke="url(#ring)" stroke-width="5"/>
      <rect x="30" y="6" width="20" height="14" rx="3" fill="url(#ring)"/>
    </g>
  </g>
  <g opacity=".55">
    <path d="M300 250c8-8 16-8 24 0M306 272c8-8 16-8 24 0" fill="none" stroke="#b97a22" stroke-width="2" stroke-linecap="round"/>
    <circle cx="60" cy="120" r="4" fill="#b97a22"/>
  </g>
</svg>
