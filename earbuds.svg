<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="白色无线耳机插画">
  <defs>
    <radialGradient id="bg" cx="70%" cy="20%" r="95%">
      <stop offset="0" stop-color="#fbf8ff"/>
      <stop offset="1" stop-color="#e4dcf7"/>
    </radialGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe1ea"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a7cf0"/>
      <stop offset="1" stop-color="#5f3fc4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#3b2a78" flood-opacity=".22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#5f3fc4" opacity=".1"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#dots)"/>
  <circle cx="86" cy="88" r="48" fill="#ffffff" opacity=".55"/>
  <ellipse cx="200" cy="328" rx="120" ry="18" fill="#3b2a78" opacity=".13" filter="url(#soft)"/>
  <g filter="url(#shadow)">
    <rect x="128" y="212" width="144" height="98" rx="34" fill="url(#white)"/>
    <rect x="128" y="226" width="144" height="10" fill="#ffffff" opacity=".7"/>
    <path d="M200 250v34" stroke="#cfd2dd" stroke-width="2" opacity=".6"/>
    <circle cx="200" cy="292" r="3" fill="#b8bccb"/>
    <g transform="rotate(-16 210 150)">
      <path d="M186 112c0-16 13-28 29-28s29 12 29 28v44c0 9-7 16-16 16h-26c-9 0-16-7-16-16z" fill="url(#white)"/>
      <rect x="198" y="108" width="14" height="34" rx="7" fill="#d2d4de"/>
      <path d="M202 170v42" stroke="#dfe1ea" stroke-width="14" stroke-linecap="round"/>
      <circle cx="202" cy="214" r="8" fill="#c9cbd8"/>
      <ellipse cx="218" cy="96" rx="11" ry="5" fill="#ffffff" opacity=".85" transform="rotate(-25 218 96)"/>
      <path d="M214 118c5 2 8 6 8 11" fill="none" stroke="#ffffff" stroke-width="2" opacity=".8"/>
    </g>
  </g>
  <g filter="url(#shadow)" transform="rotate(18 292 226)">
    <rect x="264" y="196" width="58" height="82" rx="26" fill="url(#purple)"/>
    <rect x="272" y="204" width="42" height="66" rx="20" fill="#ffffff" opacity=".12"/>
    <circle cx="293" cy="222" r="5" fill="#ffffff" opacity=".55"/>
    <path d="M284 250h18" stroke="#ffffff" stroke-width="2" opacity=".5" stroke-linecap="round"/>
  </g>
  <g opacity=".55">
    <path d="M70 260l14-6M78 282l12-2" stroke="#5f3fc4" stroke-width="2" stroke-linecap="round"/>
    <circle cx="62" cy="232" r="3" fill="#5f3fc4"/>
  </g>
</svg>
