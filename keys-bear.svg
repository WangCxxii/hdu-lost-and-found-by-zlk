      <path d="M212 204h20v10h-14v12h14v10h-20" fill="none" stroke="url(#silver)" stroke-width="9" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(40 232 140)">
      <path d="M230 128v104" stroke="url(#brass)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="230" cy="120" r="14" fill="none" stroke="url(#brass)" stroke-width="8"/>
      <path d="M236 204h18v9h-12v10h12v9h-18" fill="none" stroke="url(#brass)" stroke-width="8" stroke-linejoin="round"/>
    </g>
    <g transform="translate(252 248) rotate(-8)">
      <circle cx="24" cy="24" r="8" fill="#b97a22"/>
      <circle cx="24" cy="52" r="34" fill="url(#bear)"/>
      <circle cx="4" cy="28" r="14" fill="url(#bear)"/>
      <circle cx="44" cy="28" r="14" fill="url(#bear)"/>
      <circle cx="4" cy="28" r="8" fill="#8a5b1a" opacity=".55"/>
      <circle cx="44" cy="28" r="8" fill="#8a5b1a" opacity=".55"/>
      <circle cx="14" cy="48" r="3.6" fill="#4a2a13"/>
      <circle cx="34" cy="48" r="3.6" fill="#4a2a13"/>
      <ellipse cx="24" cy="57" rx="9" ry="7" fill="#f6d9ba"/>
      <path d="M24 52v6" stroke="#6b3c1e" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="24" cy="61" r="3" fill="#6b3c1e"/>
      <path d="M10 70c3 6 8 9 14 9s11-3 14-9" fill="none" stroke="#8a5b1a" stroke-width="2" opacity=".5"/>
    </g>
  </g>
  <g opacity=".6">
