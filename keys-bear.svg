<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="钥匙串插画">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="95%">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#ffe8c4"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe6a3"/>
      <stop offset=".45" stop-color="#e8b455"/>
      <stop offset="1" stop-color="#b97a22"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#cfd6df"/>
      <stop offset="1" stop-color="#8d9aa9"/>
    </linearGradient>
    <linearGradient id="bear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5b184"/>
      <stop offset="1" stop-color="#b87745"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#8a5b1a" flood-opacity=".24"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#b97a22" opacity=".1"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#dots)"/>
  <circle cx="314" cy="92" r="54" fill="#ffffff" opacity=".5"/>
  <ellipse cx="200" cy="330" rx="136" ry="20" fill="#8a5b1a" opacity=".13" filter="url(#soft)"/>
  <g filter="url(#shadow)">
    <circle cx="194" cy="88" r="34" fill="none" stroke="url(#silver)" stroke-width="10"/>
    <circle cx="194" cy="88" r="34" fill="none" stroke="#ffffff" stroke-width="2" opacity=".55"/>
    <g transform="rotate(18 194 120)">
      <path d="M182 116v120" stroke="url(#brass)" stroke-width="12" stroke-linecap="round"/>
      <circle cx="182" cy="104" r="18" fill="none" stroke="url(#brass)" stroke-width="10"/>
      <path d="M188 208h24v12h-18v14h18v12h-24" fill="none" stroke="url(#brass)" stroke-width="10" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(-22 210 130)">
