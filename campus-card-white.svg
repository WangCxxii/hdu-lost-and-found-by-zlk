<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="白色校园卡插画">
  <defs>
    <radialGradient id="bg" cx="70%" cy="20%" r="90%">
      <stop offset="0" stop-color="#fff8f2"/>
      <stop offset="1" stop-color="#ffe2d2"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f5fa"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#e0442c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#b03a22" flood-opacity=".25"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#e0442c" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#dots)"/>
  <circle cx="82" cy="92" r="48" fill="#ffffff" opacity=".45"/>
  <ellipse cx="200" cy="322" rx="132" ry="22" fill="#a93420" opacity=".12" filter="url(#soft)"/>
  <g transform="rotate(6 200 200)" filter="url(#shadow)">
    <rect x="58" y="104" width="284" height="180" rx="20" fill="url(#card)"/>
    <path d="M58 124c0-11 9-20 20-20h244c11 0 20 9 20 20v34H58z" fill="url(#head)"/>
    <text x="80" y="141" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#ffffff" opacity=".88" letter-spacing="1">杭州电子科技大学</text>
    <text x="80" y="166" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="2">校园卡</text>
    <circle cx="286" cy="144" r="22" fill="#ffffff" opacity=".18"/>
    <circle cx="286" cy="144" r="7" fill="#ffffff" opacity=".65"/>
    <rect x="76" y="196" width="66" height="66" rx="10" fill="#ffd9cf"/>
    <circle cx="109" cy="218" r="11" fill="#e0442c" opacity=".55"/>
    <path d="M91 250c3-13 10-19 18-19s15 6 18 19" fill="#e0442c" opacity=".55"/>
    <text x="160" y="216" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#2a211f">王同学</text>
    <text x="160" y="240" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8d7d78" letter-spacing="1">2303 · 电子信息学院</text>
    <text x="160" y="260" font-family="DIN Alternate, Arial, sans-serif" font-size="12" fill="#b0a29c" letter-spacing="3">2303 8821</text>
    <g opacity=".5">
      <rect x="292" y="196" width="24" height="3" rx="1.5" fill="#2a211f"/>
      <rect x="292" y="204" width="32" height="3" rx="1.5" fill="#2a211f"/>
      <rect x="292" y="212" width="18" height="3" rx="1.5" fill="#2a211f"/>
      <rect x="292" y="220" width="28" height="3" rx="1.5" fill="#2a211f"/>
    </g>
    <rect x="76" y="270" width="240" height="1" fill="#e7e0dc"/>
    <text x="76" y="286" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#b0a29c" letter-spacing="1">请拾到者联系失主，或交至校园服务中心</text>
  </g>
  <circle cx="330" cy="72" r="3" fill="#e0442c" opacity=".35"/>
</svg>

