<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="深蓝色雨伞插画">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="95%">
      <stop offset="0" stop-color="#f4f9ff"/>
      <stop offset="1" stop-color="#d9e7f9"/>
